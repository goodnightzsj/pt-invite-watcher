[package]
name = "pt-invite-watcher-shell"
version = "0.1.2"
description = "Native desktop / mobile shell for PT Invite Watcher"
edition = "2021"
# Tauri 2 supports stable Rust 1.77+; pin to avoid silent toolchain drift between dev boxes.
rust-version = "1.77"

[lib]
# On Android / iOS Tauri builds a cdylib; desktop picks up the bin target below.
name = "pt_invite_watcher_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pt-invite-watcher-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Minimal dependency set — each additional Tauri plugin adds a measurable
# chunk of Rust compile time in CI (reminder-hub's lean matrix runs 4x faster
# than our original). We only enable what the current shell actually calls.
tauri = { version = "2", features = ["tray-icon"] }
# Needed for spawning the Python sidecar on desktop; no-op on mobile since
# the sidecar module is cfg-gated off those targets.
tauri-plugin-shell = "2"
# Launch-at-login: macOS LaunchAgent plist, Windows startup registry, Linux
# .desktop autostart file. User-toggleable from Config → 界面设置.
tauri-plugin-autostart = "2"
# Self-updating from GitHub Releases — download + verify .sig against the
# pubkey baked into tauri.conf.json, then relaunch. User sees a banner when
# a new version is available; no background auto-download.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ephemeral local port picking for the Python sidecar.
portpicker = "0.1"
# Probe the sidecar's /health until it answers before unblocking the webview.
# `blocking` is used by sidecar.rs inside the sync Tauri setup hook on desktop
# targets; module itself is cfg-gated off mobile so the feature is inert there.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
