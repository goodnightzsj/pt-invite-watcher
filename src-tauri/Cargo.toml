[package]
name = "pt-invite-watcher-shell"
version = "0.1.0"
description = "Native desktop / mobile shell for PT Invite Watcher"
edition = "2021"
# Tauri 2 supports stable Rust 1.77+; pin to avoid silent toolchain drift between dev boxes.
rust-version = "1.77"

[lib]
# On Android / iOS Tauri builds a cdylib; desktop picks up the bin target below.
name = "pt_invite_watcher_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pt-invite-watcher-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Native notifications on desktop — wires into the existing browser notification
# toggle so one opt-in drives both paths.
tauri-plugin-notification = "2"
# Store the BasicAuth base64 blob in the OS keychain rather than localStorage
# (iOS Keychain, macOS Keychain, Android Keystore, Windows Credential Manager).
tauri-plugin-stronghold = "2"
tauri-plugin-shell = "2"
# One-shot dialog for "server URL is required" error surfacing before webview loads.
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ephemeral local port picking for the Python sidecar.
portpicker = "0.1"
# Probe the sidecar's /health until it answers before unblocking the webview.
# `blocking` is used by sidecar.rs inside the sync Tauri setup hook on desktop
# targets; module itself is cfg-gated off mobile so the feature is inert there.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
