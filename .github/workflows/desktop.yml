name: Desktop Build (Win / macOS / Linux)

# Triggers:
#   - `git push v0.1.0` → full release build, attaches artifacts to a GitHub Release
#   - Manual "Run workflow" → same build but artifacts-only, no release
# CI tests already run in docker-publish.yml on every main push; this workflow only
# concerns itself with the large, platform-native build pipeline.
on:
  push:
    # `v*` tags release all three platforms together (the common case).
    # `desktop-v*` is the per-platform knob for when only the desktop needs
    # a new build — e.g. a macOS-specific fix that doesn't affect mobile.
    # Same idea mirrors in android.yml / ios.yml with `android-v*` / `ios-v*`.
    tags: ["v*", "desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to upload release assets when triggered by a tag

jobs:
  build-desktop:
    strategy:
      # Let one runner's failure not cancel the others — users may want the
      # Windows binary even if notarization on macOS is misconfigured.
      fail-fast: false
      matrix:
        include:
          - os: macos-14                       # Apple Silicon runner — cheapest path to aarch64
            rust_target: aarch64-apple-darwin
            sidecar_triple: aarch64-apple-darwin
            bundle_dir: macos
          - os: ubuntu-22.04                   # glibc target that covers most distros
            rust_target: x86_64-unknown-linux-gnu
            sidecar_triple: x86_64-unknown-linux-gnu
            bundle_dir: linux
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_triple: x86_64-pc-windows-msvc
            bundle_dir: windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.rust_target }}

    steps:
      - uses: actions/checkout@v4

      # --- Toolchain setup ----------------------------------------------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust ${{ matrix.rust_target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: tauri-${{ matrix.rust_target }}

      # --- Linux-only system deps that Tauri's webview needs -----------
      - name: Install webkit2gtk + build-essential (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config

      # --- Python sidecar ------------------------------------------------
      - name: Install Python deps + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build webui
        run: |
          npm ci --prefix webui
          npm run --prefix webui build

      - name: Build Python sidecar binary
        shell: bash
        run: python scripts/build-sidecar/build.py --triple ${{ matrix.sidecar_triple }}

      - name: Verify sidecar was produced for Tauri
        shell: bash
        run: ls -la src-tauri/binaries

      # --- Tauri build ---------------------------------------------------
      - name: Install root npm deps (brings tauri-cli)
        run: npm ci

      - name: Resolve macOS signing identity
        # Without this, tauri-bundler tries to codesign with an empty
        # identity and errors out. `-` is Tauri's ad-hoc sentinel which
        # skips real codesign — the resulting .dmg triggers Gatekeeper
        # (right-click → Open works) but the build succeeds end-to-end.
        id: mac_signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$IDENTITY" ]; then
            echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          else
            echo "identity=-" >> "$GITHUB_OUTPUT"
          fi

      - name: Tauri build (signed)
        # Only runs when a real macOS signing identity + Apple ID + team are
        # all present; otherwise we fall through to the ad-hoc path below.
        # Splitting on `mac_signing.identity != '-'` keeps empty envars from
        # being passed as literal empty strings, which tauri-bundler treats
        # as "please notarize" and then fails on empty team id validation.
        if: ${{ steps.mac_signing.outputs.identity != '' && steps.mac_signing.outputs.identity != '-' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.mac_signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.rust_target }}

      - name: Tauri build (unsigned / ad-hoc)
        # Default path when signing secrets aren't configured. Pass only the
        # ad-hoc sentinel for macOS; don't pass APPLE_ID / APPLE_TEAM_ID so
        # tauri-bundler doesn't launch the notarize path. Windows / Linux
        # have no signing envars in this branch either.
        if: ${{ steps.mac_signing.outputs.identity == '-' || steps.mac_signing.outputs.identity == '' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.mac_signing.outputs.identity }}
        run: npx tauri build --target ${{ matrix.rust_target }}

      # --- Artifact collection ------------------------------------------
      - name: Collect + rename bundles
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.rust_target }}
        run: |
          # Consistent naming scheme across platforms — one Release page lists
          # everything uniformly, like cc-switch's Releases:
          #   pt-invite-watcher-v0.1.1-macOS-arm64.dmg
          #   pt-invite-watcher-v0.1.1-Windows-x86_64.msi
          #   pt-invite-watcher-v0.1.1-Linux-x86_64.AppImage
          # Version fragment strips the `v`/`desktop-v` prefix from the tag
          # so `desktop-v0.1.1` → `v0.1.1` in the filename.
          version="${TAG#v}"; version="${version#desktop-v}"
          case "$TARGET" in
            aarch64-apple-darwin)      platform=macOS;       arch=arm64 ;;
            x86_64-pc-windows-msvc)    platform=Windows;     arch=x86_64 ;;
            x86_64-unknown-linux-gnu)  platform=Linux;       arch=x86_64 ;;
            *)                         platform="$TARGET";   arch="" ;;
          esac
          tagf="v${version}-${platform}-${arch}"

          mkdir -p dist
          rename_copy() {
            src="$1"; ext="$2"
            [ -f "$src" ] || return 0
            cp -v "$src" "dist/pt-invite-watcher-${tagf}.${ext}"
          }

          base="src-tauri/target/${TARGET}/release/bundle"
          shopt -s nullglob
          # macOS
          for f in "$base"/dmg/*.dmg; do rename_copy "$f" "dmg"; done
          for f in "$base"/macos/*.app.tar.gz; do rename_copy "$f" "app.tar.gz"; done
          for f in "$base"/macos/*.app.tar.gz.sig; do rename_copy "$f" "app.tar.gz.sig"; done
          # Windows
          for f in "$base"/msi/*.msi; do rename_copy "$f" "msi"; done
          for f in "$base"/msi/*.msi.zip; do rename_copy "$f" "msi.zip"; done
          for f in "$base"/msi/*.msi.zip.sig; do rename_copy "$f" "msi.zip.sig"; done
          for f in "$base"/nsis/*.exe; do rename_copy "$f" "exe"; done
          for f in "$base"/nsis/*.nsis.zip; do rename_copy "$f" "nsis.zip"; done
          for f in "$base"/nsis/*.nsis.zip.sig; do rename_copy "$f" "nsis.zip.sig"; done
          # Linux
          for f in "$base"/appimage/*.AppImage; do rename_copy "$f" "AppImage"; done
          for f in "$base"/appimage/*.AppImage.sig; do rename_copy "$f" "AppImage.sig"; done
          for f in "$base"/deb/*.deb; do rename_copy "$f" "deb"; done
          for f in "$base"/rpm/*.rpm; do rename_copy "$f" "rpm"; done

          echo "--- dist/ ---"
          ls -la dist/

      - name: Generate updater manifest (latest.json)
        # The updater plugin looks for a JSON manifest at the configured
        # endpoint. Generate it per-runner with the matching .sig content
        # and platform → download-URL mapping. Each matrix runner produces
        # a slice; a final merge step on the release job combines them.
        # When TAURI_SIGNING_PRIVATE_KEY isn't set, .sig files don't exist
        # and we skip manifest generation entirely.
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') }}
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.rust_target }}
        run: |
          shopt -s nullglob
          sigs=(dist/*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "::notice::No .sig files — skipping updater manifest (TAURI_SIGNING_PRIVATE_KEY not configured?)"
            exit 0
          fi
          # Pick the first .sig for this target; Tauri produces exactly one
          # per format (dmg → .app.tar.gz.sig on mac, exe → .nsis.zip.sig on win).
          sig_file="${sigs[0]}"
          sig_contents=$(cat "$sig_file")
          # Bundle filename = sig without trailing .sig
          bundle_name="$(basename "$sig_file" .sig)"
          # release-please tags are `v0.1.0`, we strip leading `v` for version field.
          version="${TAG#v}"
          version="${version#desktop-v}"
          mkdir -p dist-manifest
          cat > "dist-manifest/latest-${TARGET}.json" <<EOF
          {
            "version": "${version}",
            "notes": "See CHANGELOG.md",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "${TARGET}": {
                "signature": ${sig_contents@Q},
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${bundle_name}"
              }
            }
          }
          EOF
          echo "Generated dist-manifest/latest-${TARGET}.json"

      - name: Upload updater manifest slice
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-${{ matrix.rust_target }}
          path: dist-manifest/*.json
          if-no-files-found: ignore

      - name: Upload artifact (workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: pt-invite-watcher-${{ matrix.rust_target }}
          path: dist/*
          if-no-files-found: error

      - name: Attach updater manifest slices to Release
        # Attach the per-target manifest files directly — the final merge
        # step produces `latest.json` that the updater endpoint URL points at.
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist-manifest/*
          draft: true
          fail_on_unmatched_files: false

      - name: Attach to Release (tag push)
        # Match both the omnibus `v*` and the platform-specific `desktop-v*`
        # tag namespaces — the step only runs when one of them triggered
        # the workflow, so manual `workflow_dispatch` runs don't clutter
        # Releases with partial artifacts.
        # Body is owned by release-body.yml (it writes a unified per-tag body
        # across all three build workflows); we intentionally don't pass
        # `body` / `body_path` / `generate_release_notes` here so
        # softprops's file-attach doesn't clobber what release-body wrote.
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          fail_on_unmatched_files: false

  # After all matrix jobs attach their per-target manifest slices, merge them
  # into a single `latest.json` (the filename the updater endpoint in
  # tauri.conf.json points at) and attach to the same Release draft.
  updater-manifest:
    name: Merge updater manifest
    needs: build-desktop
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all updater manifest slices
        uses: actions/download-artifact@v4
        with:
          pattern: updater-manifest-*
          path: slices
          merge-multiple: true
      - name: Merge slices → latest.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json, glob, sys
          slices = glob.glob("slices/latest-*.json")
          if not slices:
              print("::warning::No signed artifacts this run — skipping latest.json")
              sys.exit(0)
          merged = {"platforms": {}}
          for f in slices:
              with open(f) as fh:
                  d = json.load(fh)
              merged.setdefault("version", d["version"])
              merged.setdefault("notes", d.get("notes", ""))
              merged.setdefault("pub_date", d.get("pub_date", ""))
              merged["platforms"].update(d["platforms"])
          with open("latest.json", "w") as fh:
              json.dump(merged, fh, indent=2)
          print("Wrote merged latest.json:")
          print(open("latest.json").read())
          PY
      - name: Attach merged latest.json to Release
        if: hashFiles('latest.json') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          draft: true
          fail_on_unmatched_files: false
