name: Release Please

# Parses conventional commits on every main push, maintains an open "release PR"
# that bumps version + updates CHANGELOG.md. When the release PR is merged:
#   1. A tag (e.g. v0.2.0) is pushed
#   2. That tag triggers .github/workflows/desktop.yml / android.yml / ios.yml
#   3. Those attach their artifacts to the same Release draft
#
# So one conventional-commit discipline → one-click version bump → three native
# builds auto-attached → publish. No hand-edited CHANGELOG, no manual tagging.

on:
  push:
    branches: [main]
  # Manual re-trigger for when a permissions flip or repo-setting change
  # needs to be re-probed without waiting for the next real commit.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # v4 takes its settings from a JSON config file instead of inline
          # workflow inputs. See `release-please-config.json` +
          # `.release-please-manifest.json` at the repo root for the
          # versioning rules, extra-files mapping, and changelog sections.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GitHub safeguards against infinite workflow loops: tags / releases
          # pushed using the default `GITHUB_TOKEN` do NOT fire downstream
          # `push:tags` workflows. Without a PAT, release-please creates the
          # tag but desktop/android/ios/release-body silently skip — users
          # end up with an empty published Release.
          # `RELEASE_PAT` is a repo secret holding a personal access token
          # with `contents: write` + `pull_requests: write` scopes.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
