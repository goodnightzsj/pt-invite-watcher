name: Android Build (Capacitor)

# Builds the Capacitor Android APK (and, when signing secrets are present, AAB).
# The mobile shell is Capacitor rather than Tauri because mobile platforms
# cannot spawn the Python sidecar — we'd just pay NDK + Rust cross-compile
# cost for zero functional gain. Capacitor wraps the same `webui/` bundle in
# a standard WebView and is materially simpler to build on CI.
#
# Triggers:
#   - `git push v*` → full release, attaches artifacts to the release draft
#   - workflow_dispatch → artifacts-only run, no release
#
# Secrets (all optional; without them the build produces a debug-signed APK
# useful for sideloading):
#   ANDROID_KEYSTORE_BASE64      base64-encoded .keystore
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            alias inside keystore
#   ANDROID_KEY_PASSWORD         alias password

on:
  push:
    # `v*` releases all three platforms; `android-v*` is the per-platform
    # knob for shipping just Android without bumping desktop/iOS versions.
    tags: ["v*", "android-v*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            mobile/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      # --- Frontend + Capacitor sync -----------------------------------
      - name: Install webui deps + build
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Capacitor deps
        run: npm ci

      - name: Add Android platform (first-time init)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # --- Gradle caching -----------------------------------------------
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # --- Optional release signing -------------------------------------
      - name: Detect keystore secret
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.keystore.outputs.present == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: echo "$KS" | base64 -d > android/app/release.keystore

      - name: Configure signing properties
        if: steps.keystore.outputs.present == 'true'
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          cat >> android/gradle.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${KS_PASSWORD}
          RELEASE_KEY_ALIAS=${KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      - name: Patch build.gradle with signing config
        if: steps.keystore.outputs.present == 'true'
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          if "signingConfigs" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      if (project.hasProperty('RELEASE_STORE_FILE')) {
                          storeFile file(RELEASE_STORE_FILE)
                          storePassword RELEASE_STORE_PASSWORD
                          keyAlias RELEASE_KEY_ALIAS
                          keyPassword RELEASE_KEY_PASSWORD
                      }
                  }
              }
          """
              text = re.sub(r"(android\s*\{\s*\n)", r"\1" + signing_block, text, count=1)
          text = re.sub(
              r"(release\s*\{\s*\n)",
              r"\1            signingConfig signingConfigs.release\n",
              text,
              count=1,
          )
          gradle.write_text(text)
          print("Patched android/app/build.gradle with release signing config")
          PY

      # --- Gradle build -------------------------------------------------
      - name: Gradle build
        id: build
        shell: bash
        run: |
          cd android
          if [ "${{ steps.keystore.outputs.present }}" = "true" ] && [ "${{ github.event.inputs.build_type }}" != "debug" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect + rename artifacts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TYPE: ${{ steps.build.outputs.type }}
        run: |
          # Paths are relative to `mobile/` because `defaults.run.working-
          # directory: mobile` at the job level. A `mobile/android/...`
          # prefix here would double up to `mobile/mobile/...` and match
          # nothing — caught on the first tag release when the upload step
          # warned "No files were found". Android is a universal APK/AAB
          # (no per-arch splits configured, so one file covers every arch).
          version="${TAG#v}"; version="${version#android-v}"
          mkdir -p dist
          shopt -s nullglob
          for apk in android/app/build/outputs/apk/${TYPE}/*.apk; do
            cp -v "$apk" "dist/pt-invite-watcher-v${version}-Android-universal.apk"
          done
          for aab in android/app/build/outputs/bundle/release/*.aab; do
            cp -v "$aab" "dist/pt-invite-watcher-v${version}-Android-universal.aab"
          done
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pt-invite-watcher-android-${{ steps.build.outputs.type }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to Release (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/android-v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          fail_on_unmatched_files: false
