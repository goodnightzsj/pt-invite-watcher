name: Build and Push Docker Image

on:
  push:
    branches: [main]
    # Explicit positive filter — only the paths that actually end up baked
    # into the Docker image trigger a rebuild. Prevents dead CI runs on
    # docs edits, Tauri-shell tweaks, Capacitor config changes, and mobile
    # workflow changes that have zero effect on the backend container.
    paths:
      - "pt_invite_watcher/**"
      - "webui/**"          # Dockerfile builds webui from source + bundles dist
      - "requirements.txt"
      - "docker/**"
      - "tests/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile (bytecode)
        run: python -m compileall -q pt_invite_watcher tests tools

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Smoke test (check-once)
        run: |
          cat > /tmp/ptiw_smoke.yaml <<'YAML'
          moviepilot:
            base_url: ""
            username: ""
            password: ""
            otp_password: ""

          cookie:
            source: "auto"
            cookiecloud:
              base_url: ""
              uuid: ""
              password: ""
              refresh_interval_seconds: 300

          scan:
            interval_seconds: 600
            timeout_seconds: 1
            concurrency: 1
            user_agent: ""
            trust_env: false

          db:
            path: "/tmp/ptiw_smoke.db"

          web:
            host: "127.0.0.1"
            port: 8080
            basic_auth:
              username: ""
              password: ""
          YAML
          python -m pt_invite_watcher check-once --config /tmp/ptiw_smoke.yaml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Route docker.io pulls (base images: node:18-slim, python:3.11-slim)
          # through Google's public read-through mirror. Docker Hub's anonymous
          # + free-tier rate limits (100/6h anon, 200/6h auth'd) were tripping
          # our builds after every commit. mirror.gcr.io requires no auth and
          # falls back to docker.io on miss. Push still goes to Docker Hub via
          # the login step below — only the pull path is mirrored.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pt-invite-watcher:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pt-invite-watcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
