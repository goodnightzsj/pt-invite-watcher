name: iOS Build (Capacitor)

# Capacitor wraps the `webui/` Vite bundle in a native iOS WebView; there's
# no Tauri / Rust cross-compile in this pipeline (mobile is always remote
# mode, see runtime_config.ts). Without Apple Developer secrets this workflow
# still produces a simulator-loadable .app bundle so the UI can be smoke-
# tested from a developer Mac.
#
# Triggers:
#   - `git push v*` → full release, draft with signed .ipa attached
#   - workflow_dispatch → simulator-only artifact
#
# Required secrets for signed builds (all or nothing):
#   IOS_P12_BASE64                   base64 of developer .p12 distribution cert
#   IOS_P12_PASSWORD                 .p12 file password
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of .mobileprovision
#   IOS_PROVISIONING_PROFILE_NAME    name as shown in Apple Developer Portal
#   APPLE_TEAM_ID                    10-char team ID
#   IOS_KEYCHAIN_PASSWORD            any random string for the temp keychain

on:
  push:
    # `v*` releases all three platforms; `ios-v*` is the per-platform knob
    # for shipping just iOS without bumping desktop/Android versions.
    tags: ["v*", "ios-v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode latest-stable
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            mobile/package-lock.json

      - name: Install CocoaPods (cached by setup-xcode runner image; gem install is instant)
        run: gem install cocoapods

      # --- Frontend + Capacitor sync -----------------------------------
      - name: Install webui deps + build
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Capacitor deps
        run: npm ci

      - name: Add iOS platform (first-time init)
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods deps
        run: |
          cd ios/App
          pod install --repo-update

      # --- Detect signing secrets --------------------------------------
      - name: Detect Apple signing secrets
        id: secrets
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$P12_B64" ] && [ -n "$PROFILE_B64" ] && [ -n "$TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Signed path ---------------------------------------------------
      - name: Import signing certificate
        if: steps.secrets.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$P12_BASE64" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: steps.secrets.outputs.signed == 'true'
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build signed .ipa
        if: steps.secrets.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        shell: bash
        run: |
          cd ios/App
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pt_invite_watcher.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      # --- Unsigned fallback (simulator) ---------------------------------
      - name: Build unsigned simulator .app
        if: steps.secrets.outputs.signed != 'true'
        shell: bash
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

      - name: Pack simulator .app for upload
        if: steps.secrets.outputs.signed != 'true'
        shell: bash
        run: |
          cd ios/App/build/Build/Products/Release-iphonesimulator
          tar -czf App-simulator.app.tar.gz App.app
          mkdir -p ../../../../release
          cp App-simulator.app.tar.gz ../../../../release/

      # --- Rename + upload ---------------------------------------------
      - name: Collect + rename artifacts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.secrets.outputs.signed }}
        run: |
          version="${TAG#v}"; version="${version#ios-v}"
          mkdir -p dist
          shopt -s nullglob
          if [ "$SIGNED" = "true" ]; then
            for f in mobile/ios/App/build/ipa/*.ipa; do
              cp -v "$f" "dist/pt-invite-watcher-v${version}-iOS.ipa"
            done
          else
            # Unsigned simulator build: tarred .app that a dev can drag into Simulator.app.
            if [ -f "mobile/ios/App/release/App-simulator.app.tar.gz" ]; then
              cp -v "mobile/ios/App/release/App-simulator.app.tar.gz" \
                    "dist/pt-invite-watcher-v${version}-iOS-Simulator.app.tar.gz"
            fi
          fi
          ls -la dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pt-invite-watcher-ios-${{ steps.secrets.outputs.signed == 'true' && 'ipa' || 'simulator' }}
          path: dist/*
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to Release (tag push, signed)
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ios-v')) && steps.secrets.outputs.signed == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          fail_on_unmatched_files: false
